name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python ${{ matrix.python-version }}
        run: |
          uv python install ${{ matrix.python-version }}
          uv venv --python ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv pip install -e ".[dev]"

      - name: Lint (ruff)
        # Enforce correctness rules first while the repository's historical
        # formatting/style backlog is migrated incrementally.
        run: uv run ruff check . --select E9,F63,F7,F82

      - name: Type check (mypy)
        run: uv run mypy core/ shared/ services/ --ignore-missing-imports

      - name: Test
        run: uv run pytest --cov=core --cov=shared --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false
