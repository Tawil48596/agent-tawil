name: Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Set up Python ${{ matrix.python-version }}
        run: |
          uv python install ${{ matrix.python-version }}
          uv venv --python ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Lint Python
        run: uv run ruff check .

      - name: Type check stable modules
        run: >-
          uv run mypy
          core/
          shared/
          --ignore-missing-imports

      - name: Audit remaining plugin type debt
        continue-on-error: true
        run: uv run mypy plugins/ --ignore-missing-imports

      - name: Test with coverage gate
        run: uv run pytest --cov-report=xml --cov-report=json:coverage.json --cov-fail-under=35

      - name: Enforce critical module coverage
        run: >-
          uv run python -m scripts.check_coverage_thresholds coverage.json
          --minimum plugins/agent_engine/engine.py=85
          --minimum plugins/agent_engine/tool_dispatch.py=80
          --minimum plugins/checkpoint/execution_ledger.py=70
          --minimum plugins/conversation/session_store.py=80

      - name: Upload coverage report
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-coverage
          path: coverage.xml

      - name: Publish coverage
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

      - name: Verify wheel entry points
        if: matrix.python-version == '3.12'
        run: |
          uv build --wheel
          uv venv .release-venv --python 3.12
          uv pip install --python .release-venv/bin/python dist/*.whl
          .release-venv/bin/python -c "import app, cli; assert callable(app.main); assert callable(cli.main)"

  frontend:
    name: Frontend quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint UI
        run: npm run lint

      - name: Test UI interactions and accessibility
        run: npm test

      - name: Build production UI
        run: npm run build

  browser-smoke:
    name: Browser smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Set up Python
        run: |
          uv python install 3.12
          uv venv --python 3.12
          uv sync --frozen --extra dev

      - name: Install Chromium
        run: uv run playwright install --with-deps chromium

      - name: Start service and run browser smoke
        run: |
          uv run python app.py > server.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid' EXIT
          uv run python scripts/run_browser_smoke.py

      - name: Upload server log on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-smoke-server-log
          path: server.log

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4
        with:
          fail-on-severity: high

  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - name: Analyze
        uses: github/codeql-action/analyze@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4
