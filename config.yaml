# AI Agent Platform — Default Configuration
# All values can be overridden via environment variables.

server:
  host: "0.0.0.0"
  port: 8000
  cors_origins:
    - "http://localhost:5173"
    - "http://localhost:3000"

auth:
  enabled: false
  jwt_secret: "${JWT_SECRET}"
  api_key_header: "Authorization"
  token_expire_hours: 720

database:
  url: "sqlite:///data/agent.db"
  pool_size: 5
  echo: false

redis:
  url: "redis://localhost:6379/0"
  ttl_seconds: 3600

vector_store:
  backend: "chromadb"  # chromadb | pgvector | milvus
  chromadb:
    path: "./chroma_data"
  pgvector:
    connection_string: "${PGVECTOR_URL}"
    table_prefix: "vec_"
  milvus:
    host: "localhost"
    port: 19530

llm:
  default_model: "gpt-4o"
  fast_model: "gpt-4o-mini"
  embedding_model: "text-embedding-3-small"
  providers:
    openai:
      api_key: "${OPENAI_API_KEY}"
      base_url: "https://api.openai.com/v1"
    anthropic:
      api_key: "${ANTHROPIC_API_KEY}"
    deepseek:
      api_key: "${DEEPSEEK_API_KEY}"
      base_url: "https://api.deepseek.com/v1"
  fallback_chain:
    - openai
    - anthropic
    - deepseek

agent:
  max_turns: 50
  context_compression_threshold: 0.75
  model_routing:
    reasoning: "gpt-4o"
    coding: "claude-sonnet-4"
    summarization: "gpt-4o-mini"
    embedding: "text-embedding-3-small"

memory:
  short_term_window: 50
  long_term_backend: "builtin"
  consolidation_trigger: "session_end"
  importance_threshold: 0.3
  decay_lambda: 0.01
  max_retrieved: 10

rag:
  default_chunk_size: 512
  default_chunk_overlap: 0.1
  retrieval_top_k: 10
  rerank_top_k: 5
  hybrid_alpha: 0.7

tool_market:
  sandbox_mode: "subprocess"
  approval_required_for:
    - "terminal"
    - "code_exec"
    - "github_execute_action"
    - "browser"

mcp:
  discovery_interval: 60
  tool_call_timeout: 30

multi_agent:
  default_timeout: 300
  max_sub_agents: 10
  retry_attempts: 2
  retry_backoff: "exponential"

security:
  content_filter:
    enabled: true
    check_input: true
    check_output: true
    block_nsfw: true
    block_pii: true
  tool_approval:
    enabled: true
    auto_approve_whitelist: []
    pending_timeout: 300
    notify_webhook: ""
  sandbox:
    mode: "subprocess"   # subprocess | docker
    docker_image: "ai-agent-sandbox:latest"
    network_disabled: true
    read_only_root: true
    memory_limit: "512m"
    cpu_limit: 1.0
    timeout: 30
  secret_manager:
    backend: "env"       # env | vault | aws-secrets
    encryption_key: "${SECRETS_ENCRYPTION_KEY}"
  audit_log:
    enabled: true
    log_tool_calls: true
    log_auth_events: true

observability:
  tracing:
    enabled: false
    exporter: "console"  # console | otlp
    otlp_endpoint: "http://localhost:4317"
    sample_rate: 1.0
  metrics:
    enabled: false
    prometheus_port: 9090
  health_check:
    check_db: true
    check_redis: true
    check_llm: false

analytics:
  enabled: true
  retention_days: 90
  budget_alerts:
    daily: 50.0
    monthly: 500.0

logging:
  level: "INFO"
  format: "json"
  file: "logs/app.log"
