<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Multi-Agent Monitor — AI Agent Platform</title>
<style>
:root { --bg:#0f1117; --surface:#1a1d27; --border:#2a2d3a; --text:#e1e4ea; --text-dim:#8b8fa3; --accent:#6c8cff; --green:#4ade80; --red:#f87171; --yellow:#fbbf24; --purple:#c084fc; --orange:#fb923c; }
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: -apple-system, system-ui, sans-serif; background:var(--bg); color:var(--text); height:100vh; display:flex; flex-direction:column; }
.header { padding:14px 20px; border-bottom:1px solid var(--border); display:flex; align-items:center; gap:16px; }
.header h1 { font-size:17px; }
.header a { color:var(--accent); font-size:12px; text-decoration:none; }
.header .status-bar { display:flex; gap:16px; font-size:12px; margin-left:auto; }
.status { display:flex; align-items:center; gap:6px; }
.status .dot { width:8px; height:8px; border-radius:50%; }
.dot.running { background:var(--green); animation: pulse 1.5s infinite; }
.dot.idle { background:var(--text-dim); }
.dot.failed { background:var(--red); }
@keyframes pulse { 0%,100% { opacity:1 } 50% { opacity:0.4 } }
.content { flex:1; display:flex; overflow:hidden; }
.panel { flex:1; overflow-y:auto; padding:16px; }
.panel.left { border-right:1px solid var(--border); max-width:400px; }
.panel.center { flex:2; }
.panel.right { border-left:1px solid var(--border); max-width:380px; }
h3 { font-size:13px; text-transform:uppercase; letter-spacing:0.5px; color:var(--text-dim); margin-bottom:12px; padding-bottom:8px; border-bottom:1px solid var(--border); }
.task-card { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:14px; margin-bottom:10px; cursor:pointer; }
.task-card:hover { border-color:var(--accent); }
.task-card .title { font-weight:600; font-size:14px; }
.task-card .meta { font-size:11px; color:var(--text-dim); margin-top:6px; }
.progress-bar { background:var(--border); border-radius:4px; height:6px; margin-top:8px; overflow:hidden; }
.progress-bar .fill { height:100%; border-radius:4px; transition:width 0.3s; }
.fill.green { background:var(--green); }
.fill.blue { background:var(--accent); }
.fill.yellow { background:var(--yellow); }
.fill.red { background:var(--red); }
.agent-node { padding:8px 12px; margin:4px 0; border-left:3px solid var(--border); font-size:13px; }
.agent-node.running { border-left-color:var(--accent); }
.agent-node.completed { border-left-color:var(--green); }
.agent-node.failed { border-left-color:var(--red); }
.agent-node.pending { border-left-color:var(--text-dim); }
.agent-node .name { font-weight:500; }
.agent-node .goal { font-size:11px; color:var(--text-dim); }
.agent-node .status-badge { font-size:10px; padding:2px 6px; border-radius:3px; margin-left:8px; }
.badge.running { background:rgba(108,140,255,0.15); color:var(--accent); }
.badge.completed { background:rgba(74,222,128,0.15); color:var(--green); }
.badge.failed { background:rgba(248,113,113,0.15); color:var(--red); }
.badge.pending { background:rgba(139,143,163,0.1); color:var(--text-dim); }
.log-line { font-size:11px; padding:4px 8px; font-family:monospace; border-bottom:1px solid rgba(255,255,255,0.03); }
.log-line .ts { color:var(--text-dim); margin-right:8px; }
.log-line.info { color:var(--text); }
.log-line.warn { color:var(--yellow); }
.log-line.error { color:var(--red); }
.checkpoint-item { background:var(--surface); border:1px solid var(--border); border-radius:6px; padding:10px; margin-bottom:6px; font-size:12px; }
.checkpoint-item .stage { color:var(--accent); font-weight:600; }
button { background:var(--accent); color:#fff; border:none; padding:8px 14px; border-radius:6px; cursor:pointer; font-size:12px; margin:4px; }
button.danger { background:#5d1a1a; color:var(--red); }
button:hover { opacity:0.9; }
.empty { text-align:center; padding:40px; color:var(--text-dim); }
</style>
</head>
<body>

<div class="header">
  <h1>🤖 Multi-Agent Monitor</h1>
  <a href="/">← 对话</a> <a href="/trace.html">Trace Viewer</a> <a href="/analytics.html">用量</a>
  <div class="status-bar">
    <div class="status"><span class="dot idle" id="orchDot"></span> 编排器</div>
    <div class="status"><span class="dot idle" id="workerDot"></span> Worker: <span id="workerCount">0</span></div>
    <div class="status"><span class="dot idle" id="hitlDot"></span> HITL: <span id="hitlPending">0</span>待审批</div>
  </div>
</div>

<div class="content">
  <!-- Left: Task Board -->
  <div class="panel left">
    <h3>📋 任务看板</h3>
    <div id="taskBoard"><div class="empty">暂无任务<br><span style="font-size:11px">从对话中创建多智能体任务</span></div></div>
  </div>

  <!-- Center: Agent Tree + Logs -->
  <div class="panel center">
    <h3>🌳 Agent 层级树</h3>
    <div id="agentTree"><div class="empty">选择左侧任务查看 Agent 树</div></div>
    <h3 style="margin-top:20px">📜 实时日志</h3>
    <div id="agentLogs" style="background:var(--bg);border:1px solid var(--border);border-radius:8px;max-height:300px;overflow-y:auto;font-family:monospace">
      <div class="log-line info"><span class="ts">--:--:--</span>等待任务...</div>
    </div>
  </div>

  <!-- Right: Checkpoints + HITL -->
  <div class="panel right">
    <h3>💾 检查点</h3>
    <div id="checkpoints"><div class="empty">暂无检查点</div></div>
    <h3 style="margin-top:20px">⏸️ HITL 审批队列</h3>
    <div id="hitlQueue"><div class="empty">无待审批项</div></div>
  </div>
</div>

<script>
const API = '/api/v1';
let refreshTimer;

async function init() {
  await refreshAll();
  refreshTimer = setInterval(refreshAll, 3000);
}

async function refreshAll() {
  await Promise.all([loadTasks(), loadHITL()]);
}

async function loadTasks() {
  try {
    const r = await fetch(`${API}/agents/tasks`);
    const data = await r.json();
    renderTaskBoard(data.plans||[]);
  } catch(e) {}
}

function renderTaskBoard(plans) {
  if (!plans.length) {
    document.getElementById('taskBoard').innerHTML = '<div class="empty">暂无任务</div>';
    return;
  }
  document.getElementById('taskBoard').innerHTML = plans.map(p => {
    const progress = p.progress || 0;
    const pct = Math.round(progress * 100);
    const color = p.status === 'completed' ? 'green' : p.status === 'running' ? 'blue' : p.status === 'failed' ? 'red' : 'yellow';
    return `
    <div class="task-card" onclick="selectTask('${p.id}')">
      <div class="title">${p.title}</div>
      <div class="meta">${p.mode} · ${p.completed||0}/${p.tasks} 完成 · ${p.status}</div>
      <div class="progress-bar"><div class="fill ${color}" style="width:${pct}%"></div></div>
      <div class="meta">${pct}%</div>
    </div>`;
  }).join('');
}

async function selectTask(planId) {
  try {
    const r = await fetch(`${API}/agents/tasks/${planId}`);
    const plan = await r.json();
    renderAgentTree(plan.tasks||[]);
    await loadCheckpoints(planId);
    document.getElementById('workerCount').textContent = plan.tasks?.length || 0;
  } catch(e) {}
}

function renderAgentTree(tasks) {
  if (!tasks.length) {
    document.getElementById('agentTree').innerHTML = '<div class="empty">无子任务</div>';
    return;
  }
  document.getElementById('agentTree').innerHTML = tasks.map(t => {
    const status = t.status || 'pending';
    const progress = Math.round((t.progress||0)*100);
    return `
    <div class="agent-node ${status}">
      <span class="name">🤖 ${t.goal?.substring(0,60) || 'Unnamed'}</span>
      <span class="status-badge badge.${status}">${status}</span>
      <div class="goal">${progress}% · ${t.result ? t.result.substring(0,80) : ''}</div>
      ${t.error ? `<div class="goal" style="color:var(--red)">⚠ ${t.error}</div>` : ''}
    </div>`;
  }).join('');
}

async function loadCheckpoints(taskId) {
  try {
    const r = await fetch(`${API}/agents/checkpoints/${taskId}`);
    const data = await r.json();
    const cps = data.checkpoints||[];
    if (!cps.length) {
      document.getElementById('checkpoints').innerHTML = '<div class="empty">暂无检查点</div>';
      return;
    }
    document.getElementById('checkpoints').innerHTML = cps.map(c => `
      <div class="checkpoint-item">
        <span class="stage">💾 ${c.stage}</span>
        <div style="font-size:11px;color:var(--text-dim)">${new Date(c.created_at*1000).toLocaleTimeString()}</div>
      </div>
    `).join('');
  } catch(e) {}
}

async function loadHITL() {
  try {
    const r = await fetch(`${API}/agents/hitl/pending`);
    const data = await r.json();
    const requests = data.requests||[];
    document.getElementById('hitlPending').textContent = requests.length;
    document.getElementById('hitlDot').className = requests.length ? 'dot running' : 'dot idle';

    if (!requests.length) {
      document.getElementById('hitlQueue').innerHTML = '<div class="empty">无待审批项</div>';
      return;
    }
    document.getElementById('hitlQueue').innerHTML = requests.map(r => `
      <div class="checkpoint-item" style="border-color:var(--yellow)">
        <div style="font-weight:600">⏸️ ${r.title}</div>
        <div style="font-size:11px;margin:6px 0">${r.description}</div>
        <div>
          <button onclick="hitlAction('${r.id}','approve')">✓ 批准</button>
          <button class="danger" onclick="hitlAction('${r.id}','deny')">✗ 拒绝</button>
        </div>
      </div>
    `).join('');
  } catch(e) {}
}

async function hitlAction(reqId, action) {
  await fetch(`${API}/agents/hitl/${reqId}/action`, {
    method:'POST', headers:{'Content-Type':'application/json'},
    body:JSON.stringify({action})
  });
  await loadHITL();
}

init();
</script>
</body>
</html>
