<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Agent Platform</title>
<style>
:root {
  --bg: #0f1117; --surface: #1a1d27; --border: #2a2d3a;
  --text: #e1e4ea; --text-dim: #8b8fa3; --accent: #6c8cff;
  --green: #4ade80; --red: #f87171; --yellow: #fbbf24;
  --user-bg: #2a2d3a; --agent-bg: #1a1d27;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); height: 100vh; display: flex; }
.sidebar { width: 260px; background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; flex-shrink: 0; }
.sidebar-header { padding: 16px; border-bottom: 1px solid var(--border); }
.sidebar-header h1 { font-size: 16px; font-weight: 600; }
.sidebar-header .ver { font-size: 11px; color: var(--text-dim); }
.session-list { flex: 1; overflow-y: auto; padding: 8px; }
.session-item { padding: 10px 12px; border-radius: 8px; cursor: pointer; font-size: 13px; margin-bottom: 2px; color: var(--text-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.session-item:hover, .session-item.active { background: var(--border); color: var(--text); }
.main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
.header { padding: 12px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; }
.header select { background: var(--surface); color: var(--text); border: 1px solid var(--border); padding: 6px 12px; border-radius: 6px; font-size: 13px; }
.messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 16px; }
.msg { max-width: 800px; padding: 12px 16px; border-radius: 12px; font-size: 14px; line-height: 1.6; }
.msg.user { background: var(--user-bg); align-self: flex-end; }
.msg.agent { background: var(--agent-bg); align-self: flex-start; border: 1px solid var(--border); }
.msg.agent .think { color: var(--text-dim); font-style: italic; font-size: 12px; padding: 4px 0; }
.msg .tool-call { background: #1e2030; border: 1px solid var(--yellow); color: var(--yellow); padding: 6px 10px; border-radius: 6px; font-size: 12px; margin: 6px 0; font-family: monospace; }
.msg .tool-result { background: #1a2e1a; border: 1px solid var(--green); color: var(--green); padding: 6px 10px; border-radius: 6px; font-size: 12px; margin: 4px 0; white-space: pre-wrap; max-height: 120px; overflow-y: auto; }
.input-area { padding: 16px 20px; border-top: 1px solid var(--border); display: flex; gap: 10px; }
.input-area textarea { flex: 1; background: var(--surface); color: var(--text); border: 1px solid var(--border); border-radius: 10px; padding: 12px; resize: none; font-size: 14px; font-family: inherit; min-height: 48px; max-height: 200px; }
.input-area button { background: var(--accent); color: #fff; border: none; border-radius: 10px; padding: 0 20px; cursor: pointer; font-size: 14px; font-weight: 500; white-space: nowrap; }
.input-area button:hover { opacity: 0.9; }
.input-area button:disabled { opacity: 0.4; cursor: not-allowed; }
.panel { width: 320px; background: var(--surface); border-left: 1px solid var(--border); overflow-y: auto; padding: 16px; flex-shrink: 0; }
.panel h3 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-dim); margin-bottom: 12px; }
.panel-section { margin-bottom: 20px; }
.tool-item { font-size: 12px; padding: 6px 8px; border-radius: 4px; margin-bottom: 4px; color: var(--text-dim); }
.tool-item .name { color: var(--text); font-weight: 500; }
.tag { display: inline-block; background: var(--border); color: var(--text-dim); font-size: 10px; padding: 2px 6px; border-radius: 3px; margin-right: 4px; }
.status-dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; margin-right: 6px; }
.status-dot.ok { background: var(--green); }
.status-dot.warn { background: var(--yellow); }
.status-dot.err { background: var(--red); }
.new-chat-btn { width: 100%; padding: 10px; background: var(--accent); color: #fff; border: none; border-radius: 8px; cursor: pointer; font-size: 13px; margin-bottom: 12px; }
.footer { padding: 6px 16px; border-top: 1px solid var(--border); font-size: 11px; color: var(--text-dim); display: flex; justify-content: space-between; }
pre { background: #0d1117; padding: 12px; border-radius: 8px; overflow-x: auto; font-size: 12px; margin: 8px 0; }
code { font-family: 'JetBrains Mono', 'Fira Code', monospace; font-size: 12px; }
@media (max-width: 900px) { .panel, .sidebar { display: none; } }
</style>
</head>
<body>

<!-- Sidebar -->
<div class="sidebar">
  <div class="sidebar-header">
    <h1>🤖 AI Agent Platform</h1>
    <span class="ver">v0.1.0 · Phase 1-7 complete</span>
  </div>
  <div style="padding:8px">
    <button class="new-chat-btn" onclick="newChat()">+ 新对话</button>
  </div>
  <div class="session-list" id="sessionList"></div>
  <div class="footer">
    <span id="apiStatus">● 离线</span>
    <span id="tokenCount">0 tokens</span>
  </div>
</div>

<!-- Main Chat -->
<div class="main">
  <div class="header">
    <select id="modelSelect" onchange="switchModel()">
      <option value="">自动路由</option>
    </select>
    <span style="font-size:12px;color:var(--text-dim)" id="taskLabel">任务: 通用推理</span>
    <select id="taskSelect" onchange="switchTask()" style="margin-left:8px">
      <option value="reasoning">推理</option>
      <option value="coding">编码</option>
      <option value="summarization">摘要</option>
    </select>
    <span style="flex:1"></span>
    <button onclick="clearChat()" style="background:transparent;color:var(--text-dim);border:1px solid var(--border);padding:4px 10px;border-radius:6px;cursor:pointer;font-size:12px">清除</button>
  </div>
  <div class="messages" id="messages">
    <div style="text-align:center;margin-top:80px;color:var(--text-dim)">
      <div style="font-size:48px;margin-bottom:16px">🤖</div>
      <div style="font-size:18px;font-weight:600;color:var(--text)">AI Agent Platform</div>
      <div style="margin-top:8px">输入问题开始对话，或在左侧创建新会话</div>
      <div style="margin-top:16px;font-size:12px">
        支持: 自由切换模型 · GitHub代码搜索 · RAG知识库 · 多智能体协作
      </div>
    </div>
  </div>
  <div class="input-area">
    <textarea id="input" placeholder="输入消息... (Enter 发送, Shift+Enter 换行)" rows="1" onkeydown="handleKey(event)"></textarea>
    <button id="sendBtn" onclick="sendMessage()">发送</button>
  </div>
</div>

<!-- Right Panel -->
<div class="panel" id="rightPanel">
  <div class="panel-section">
    <h3>🔧 已加载工具</h3>
    <div id="toolList">加载中...</div>
  </div>
  <div class="panel-section">
    <h3>📊 系统状态</h3>
    <div id="systemStatus">加载中...</div>
  </div>
  <div class="panel-section">
    <h3>📋 可用命令</h3>
    <div style="font-size:11px;color:var(--text-dim);line-height:1.8">
      /model &lt;name&gt; 切换模型<br>
      /models 查看模型列表<br>
      /task &lt;type&gt; 切换任务<br>
      /clear 清除对话
    </div>
  </div>
</div>

<script>
const API = 'http://localhost:8080/api/v1';
let currentSession = null;
let streaming = false;
let currentModel = '';
let currentTask = 'reasoning';

// Init
async function init() {
  try {
    const r = await fetch('http://localhost:8080/health');
    const h = await r.json();
    document.getElementById('apiStatus').innerHTML = '<span class="status-dot ok"></span>API 在线';
    document.getElementById('apiStatus').querySelector('.status-dot').className = 'status-dot ok';
  } catch(e) {
    document.getElementById('apiStatus').innerHTML = '<span class="status-dot err"></span>离线';
  }
  await loadModels();
  await loadTools();
  await loadSessions();
}

async function loadModels() {
  try {
    const r = await fetch(`${API}/chat/models`);
    const data = await r.json();
    const sel = document.getElementById('modelSelect');
    data.available_models.forEach(m => {
      const opt = document.createElement('option');
      opt.value = m; opt.textContent = m;
      if (m === data.default_model) opt.selected = true;
      sel.appendChild(opt);
    });
  } catch(e) {}
}

async function loadTools() {
  try {
    const r = await fetch(`${API}/tools`);
    const data = await r.json();
    const html = data.tools.map(t =>
      `<div class="tool-item"><span class="name">${t.name}</span><br>
       <span style="font-size:11px">${t.description}</span>
       ${t.is_dangerous ? ' <span class="tag" style="background:#3d1515;color:var(--red)">危险</span>' : ''}
       ${t.tags.map(g => `<span class="tag">${g}</span>`).join('')}</div>`
    ).join('');
    document.getElementById('toolList').innerHTML = html || '(无工具)';
  } catch(e) { document.getElementById('toolList').textContent = '加载失败'; }
}

async function loadSessions() {
  try {
    const r = await fetch(`${API}/chat/sessions`);
    const data = await r.json();
    renderSessions(data.items || []);
  } catch(e) {}
}

function renderSessions(sessions) {
  const html = sessions.map(s =>
    `<div class="session-item${currentSession === s.id ? ' active' : ''}" onclick="selectSession('${s.id}')">
      ${s.title || '未命名'} <span style="font-size:10px;color:var(--text-dim)">${(s.created_at||'').slice(0,10)}</span>
    </div>`
  ).join('');
  document.getElementById('sessionList').innerHTML = html || '<div style="padding:12px;color:var(--text-dim);font-size:12px">暂无会话</div>';
}

async function newChat() {
  try {
    const r = await fetch(`${API}/chat/sessions`, {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({title:'新对话 ' + new Date().toLocaleTimeString()})
    });
    const s = await r.json();
    currentSession = s.id;
    document.getElementById('messages').innerHTML = '';
    await loadSessions();
  } catch(e) { alert('创建会话失败: ' + e.message); }
}

function selectSession(id) {
  currentSession = id;
  loadMessages(id);
  loadSessions();
}

async function loadMessages(sid) {
  try {
    const r = await fetch(`${API}/chat/sessions/${sid}/messages`);
    const data = await r.json();
    const msgs = document.getElementById('messages');
    msgs.innerHTML = '';
    (data.items||[]).forEach(m => {
      if (m.role === 'user') addMessage('user', m.content);
      else if (m.role === 'assistant') addMessage('agent', m.content);
    });
  } catch(e) {}
}

function switchModel() {
  currentModel = document.getElementById('modelSelect').value;
  addMessage('system', currentModel ? `已切换模型: ${currentModel}` : '已切换为自动路由');
}

function switchTask() {
  currentTask = document.getElementById('taskSelect').value;
  document.getElementById('taskLabel').textContent = '任务: ' + {reasoning:'通用推理',coding:'编码',summarization:'摘要'}[currentTask];
}

function clearChat() {
  document.getElementById('messages').innerHTML = '';
}

function addMessage(role, content) {
  const msgs = document.getElementById('messages');
  // Remove welcome message
  const welcome = msgs.querySelector('div[style]');
  if (welcome && welcome.textContent.includes('AI Agent Platform')) welcome.remove();

  const div = document.createElement('div');
  div.className = `msg ${role === 'user' ? 'user' : role === 'system' ? 'agent' : 'agent'}`;
  if (role === 'system') div.style.fontSize = '12px';
  div.innerHTML = renderContent(content);
  msgs.appendChild(div);
  msgs.scrollTop = msgs.scrollHeight;
  return div;
}

function renderContent(text) {
  if (!text) return '';
  return text
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/```(\w*)\n?([\s\S]*?)```/g, '<pre><code>$2</code></pre>')
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/\n/g, '<br>');
}

function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
}

async function sendMessage() {
  const input = document.getElementById('input');
  const text = input.value.trim();
  if (!text || streaming) return;

  // Handle slash commands
  if (text.startsWith('/')) {
    handleCommand(text);
    input.value = '';
    return;
  }

  if (!currentSession) await newChat();
  if (!currentSession) return;

  input.value = '';
  addMessage('user', text);
  streaming = true;
  document.getElementById('sendBtn').disabled = true;

  const agentDiv = addMessage('agent', '');
  let fullText = '';
  let toolDiv = null;

  try {
    const resp = await fetch(`${API}/chat/sessions/${currentSession}/messages`, {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({content:text, model: currentModel || undefined, task_type: currentTask})
    });

    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';

    while (true) {
      const {done, value} = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, {stream: true});

      const lines = buffer.split('\n');
      buffer = lines.pop();

      for (const line of lines) {
        if (line.startsWith('data: ')) {
          try {
            const data = JSON.parse(line.slice(6));
            if (data.type === 'text') {
              fullText += data.content;
              agentDiv.innerHTML = renderContent(fullText);
            } else if (data.type === 'tool_call' || data.type === 'tool_calls') {
              const calls = data.calls || [data];
              calls.forEach(c => {
                const name = c.function?.name || c.name || '?';
                toolDiv = document.createElement('div');
                toolDiv.className = 'tool-call';
                toolDiv.textContent = '🔧 ' + name;
                agentDiv.appendChild(toolDiv);
              });
            } else if (data.type === 'tool_result' || data.type === 'tool_results') {
              const results = data.results || [data];
              results.forEach(r => {
                const resDiv = document.createElement('div');
                resDiv.className = 'tool-result';
                resDiv.textContent = (r.output || r.result || '').substring(0, 500);
                agentDiv.appendChild(resDiv);
              });
            } else if (data.type === 'done') {
              const tokens = data.usage?.total_tokens || 0;
              document.getElementById('tokenCount').textContent = tokens + ' tokens';
            } else if (data.type === 'error') {
              agentDiv.innerHTML += `<span style="color:var(--red)">❌ ${data.message}</span>`;
            }
          } catch(e) {}
        }
      }
    }
  } catch(e) {
    agentDiv.innerHTML += `<span style="color:var(--red)">❌ 请求失败: ${e.message}</span>`;
    agentDiv.innerHTML += `<br><span style="color:var(--text-dim);font-size:12px">💡 请确保已配置 API Key (OPENAI_API_KEY 等)</span>`;
  }

  streaming = false;
  document.getElementById('sendBtn').disabled = false;
  document.getElementById('messages').scrollTop = document.getElementById('messages').scrollHeight;
  loadSessions();
}

function handleCommand(cmd) {
  const parts = cmd.split(/\s+/);
  switch(parts[0]) {
    case '/model':
      if (parts[1]) {
        document.getElementById('modelSelect').value = parts[1];
        switchModel();
      }
      break;
    case '/models':
      addMessage('system', '可用模型: ' + Array.from(document.getElementById('modelSelect').options).map(o=>o.value).join(', '));
      break;
    case '/task':
      if (parts[1]) document.getElementById('taskSelect').value = parts[1];
      switchTask();
      break;
    case '/clear':
      clearChat();
      break;
    default:
      addMessage('system', '未知命令。可用: /model, /models, /task, /clear');
  }
}

// Start
init();
</script>
</body>
</html>
