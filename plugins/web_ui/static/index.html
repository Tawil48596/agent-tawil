<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Agent Platform</title>
<style>
:root { --bg:#0f1117; --surface:#1a1d27; --border:#2a2d3a; --text:#e1e4ea; --text-dim:#8b8fa3; --accent:#6c8cff; --green:#4ade80; --red:#f87171; --yellow:#fbbf24; --purple:#c084fc; --orange:#fb923c; --cyan:#22d3ee; }
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; background:var(--bg); color:var(--text); height:100vh; display:flex; flex-direction:column; overflow:hidden; }
/* Top Nav */
.nav { background:var(--surface); border-bottom:1px solid var(--border); display:flex; align-items:center; padding:0 16px; height:48px; flex-shrink:0; gap:4px; }
.nav h1 { font-size:15px; font-weight:600; margin-right:16px; white-space:nowrap; }
.nav .tab { padding:8px 16px; border:none; background:none; color:var(--text-dim); cursor:pointer; font-size:13px; border-radius:6px; white-space:nowrap; }
.nav .tab:hover { color:var(--text); background:var(--border); }
.nav .tab.active { color:var(--accent); background:rgba(108,140,255,0.1); }
.nav .spacer { flex:1; }
.nav select { background:var(--surface); color:var(--text); border:1px solid var(--border); padding:5px 10px; border-radius:6px; font-size:12px; }
.nav .dot { width:7px; height:7px; border-radius:50%; display:inline-block; margin-right:6px; }
.nav .dot.ok { background:var(--green); }
.nav .dot.err { background:var(--red); }
/* Layout */
.body { flex:1; display:flex; overflow:hidden; }
.sidebar { width:240px; background:var(--surface); border-right:1px solid var(--border); display:flex; flex-direction:column; flex-shrink:0; }
.sidebar .sessions { flex:1; overflow-y:auto; padding:8px; }
.sidebar .sess { padding:10px 12px; border-radius:6px; cursor:pointer; font-size:12px; margin-bottom:2px; color:var(--text-dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.sidebar .sess:hover,.sess.active { background:var(--border); color:var(--text); }
.sidebar button { margin:8px; padding:10px; background:var(--accent); color:#fff; border:none; border-radius:8px; cursor:pointer; font-size:13px; }
.main { flex:1; display:flex; flex-direction:column; overflow:hidden; min-width:0; }
.panel { width:300px; background:var(--surface); border-left:1px solid var(--border); overflow-y:auto; padding:12px; flex-shrink:0; font-size:12px; }
.panel h3 { font-size:11px; text-transform:uppercase; color:var(--text-dim); margin:12px 0 8px; }
/* Chat */
.chat-view { flex:1; display:flex; flex-direction:column; overflow:hidden; }
.messages { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:12px; }
.msg { max-width:85%; padding:10px 14px; border-radius:10px; font-size:14px; line-height:1.5; }
.msg.user { background:var(--surface); align-self:flex-end; }
.msg.agent { background:var(--bg); align-self:flex-start; border:1px solid var(--border); }
.msg .tool { background:rgba(251,191,36,0.08); border:1px solid var(--yellow); color:var(--yellow); padding:5px 8px; border-radius:5px; font-size:11px; margin:4px 0; font-family:monospace; }
.input-row { padding:12px 16px; border-top:1px solid var(--border); display:flex; gap:8px; }
.input-row textarea { flex:1; background:var(--surface); color:var(--text); border:1px solid var(--border); border-radius:10px; padding:10px; resize:none; font:inherit; font-size:14px; min-height:44px; max-height:150px; }
.input-row button { background:var(--accent); color:#fff; border:none; border-radius:10px; padding:0 20px; cursor:pointer; font-size:14px; white-space:nowrap; }
.input-row button:disabled { opacity:0.4; }
/* Trace / Agents / Analytics panels */
.view { flex:1; overflow-y:auto; padding:16px; display:none; }
.view.active { display:block; }
.span-row { display:flex; align-items:center; gap:8px; padding:4px 0; font-size:12px; }
.span-row .tp { padding:1px 6px; border-radius:3px; font-size:10px; font-weight:600; }
.tp.llm { background:rgba(108,140,255,0.15); color:var(--accent); }
.tp.tool { background:rgba(251,191,36,0.15); color:var(--yellow); }
.tp.think { background:rgba(192,132,252,0.15); color:var(--purple); }
.tp.rag { background:rgba(74,222,128,0.15); color:var(--green); }
.kpi-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:10px; margin-bottom:16px; }
.kpi { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:16px; text-align:center; }
.kpi .v { font-size:26px; font-weight:700; }
.kpi .l { font-size:11px; color:var(--text-dim); margin-top:4px; }
.task-card { background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:12px; margin-bottom:8px; }
.task-card .t { font-weight:600; font-size:13px; }
.task-card .m { font-size:11px; color:var(--text-dim); margin-top:4px; }
.prog { background:var(--border); border-radius:4px; height:5px; margin-top:6px; overflow:hidden; }
.prog div { height:100%; border-radius:4px; }
.badge { font-size:10px; padding:2px 6px; border-radius:3px; }
.badge.ok { background:rgba(74,222,128,0.15); color:var(--green); }
.badge.warn { background:rgba(251,191,36,0.15); color:var(--yellow); }
.badge.err { background:rgba(248,113,113,0.15); color:var(--red); }
.bar-row { display:flex; align-items:center; gap:8px; margin:6px 0; font-size:12px; }
.bar-row .lbl { width:100px; text-align:right; color:var(--text-dim); }
.bar-row .bg { flex:1; background:var(--border); border-radius:4px; height:18px; overflow:hidden; }
.bar-row .fg { height:100%; border-radius:4px; display:flex; align-items:center; padding-left:8px; font-size:10px; }
.empty { text-align:center; color:var(--text-dim); padding:40px; font-size:13px; }
@media (max-width:800px) { .sidebar,.panel { display:none; } }
</style>
</head>
<body>

<nav class="nav">
  <h1>🤖 AI Agent Platform</h1>
  <button class="tab active" onclick="switchTab('chat')" id="tab-chat">💬 对话</button>
  <button class="tab" onclick="switchTab('trace')" id="tab-trace">🔍 Trace</button>
  <button class="tab" onclick="switchTab('agents')" id="tab-agents">🤖 Agents</button>
  <button class="tab" onclick="switchTab('analytics')" id="tab-analytics">📊 用量</button>
  <span class="spacer"></span>
  <select id="modelSel" onchange="setModel()"><option value="">自动路由</option></select>
  <select id="taskSel" onchange="setTask()"><option value="reasoning">推理</option><option value="coding">编码</option><option value="summarization">摘要</option></select>
  <span style="font-size:11px;color:var(--text-dim)"><span class="dot ok" id="apiDot"></span><span id="apiLabel">在线</span></span>
</nav>

<div class="body">
  <!-- Sidebar -->
  <div class="sidebar">
    <button onclick="newChat()">+ 新对话</button>
    <div class="sessions" id="sessList"><div class="empty">暂无会话</div></div>
  </div>

  <!-- Main Content -->
  <div class="main">
    <!-- Chat View -->
    <div class="chat-view view active" id="view-chat">
      <div class="messages" id="msgs">
        <div class="empty" style="margin-top:60px">
          <div style="font-size:40px;margin-bottom:12px">🤖</div>
          <div style="font-size:16px;font-weight:600;color:var(--text)">AI Agent Platform</div>
          <div style="margin-top:6px">输入消息开始对话 · 支持模型切换 · GitHub搜索 · RAG检索</div>
        </div>
      </div>
      <div class="input-row">
        <textarea id="inp" placeholder="输入消息... (Enter 发送)" rows="1" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();send()}"></textarea>
        <button id="sendBtn" onclick="send()">发送</button>
      </div>
    </div>

    <!-- Trace View -->
    <div class="view" id="view-trace">
      <div style="display:flex;gap:8px;margin-bottom:12px;align-items:center">
        <h3 style="font-size:14px">调用链追踪</h3><span style="flex:1"></span>
        <button onclick="loadTraces()" style="background:var(--accent);color:#fff;border:none;padding:6px 12px;border-radius:6px;cursor:pointer;font-size:12px">刷新</button>
      </div>
      <div id="traceStats" class="kpi-grid"></div>
      <div id="traceList"><div class="empty">暂无 Trace 数据<br><span style="font-size:11px">发送对话后将自动记录调用链</span></div></div>
    </div>

    <!-- Agents View -->
    <div class="view" id="view-agents">
      <h3 style="font-size:14px;margin-bottom:12px">多智能体任务监控</h3>
      <div id="agentBoard"><div class="empty">暂无任务</div></div>
      <div id="hitlPanel" style="margin-top:16px"></div>
    </div>

    <!-- Analytics View -->
    <div class="view" id="view-analytics">
      <div id="kpiRow" class="kpi-grid">
        <div class="kpi"><div class="v" style="color:var(--accent)">0</div><div class="l">今日 Token</div></div>
        <div class="kpi"><div class="v" style="color:var(--green)">$0</div><div class="l">今日成本</div></div>
        <div class="kpi"><div class="v" style="color:var(--purple)">0</div><div class="l">请求数</div></div>
        <div class="kpi"><div class="v" style="color:var(--yellow)">0ms</div><div class="l">平均延迟</div></div>
        <div class="kpi"><div class="v" style="color:var(--cyan)">8</div><div class="l">已加载工具</div></div>
        <div class="kpi"><div class="v" style="color:var(--orange)">0</div><div class="l">活跃会话</div></div>
      </div>
      <div style="display:grid;grid-template-columns:2fr 1fr;gap:12px">
        <div style="background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px">
          <h3 style="font-size:12px;color:var(--text-dim);margin-bottom:10px">模型用量</h3>
          <div id="modelBars"></div>
        </div>
        <div style="background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px">
          <h3 style="font-size:12px;color:var(--text-dim);margin-bottom:10px">系统状态</h3>
          <div id="sysStatus" style="font-size:12px;line-height:1.8"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Right Panel -->
  <div class="panel" id="rightPanel">
    <h3>🔧 工具 (8)</h3>
    <div id="toolPanel" style="font-size:11px;line-height:1.6"></div>
    <h3>📋 快捷命令</h3>
    <div style="font-size:11px;color:var(--text-dim);line-height:1.8">
      /model &lt;name&gt; · /models · /task &lt;type&gt; · /clear
    </div>
  </div>
</div>

<script>
var A='',S=null,streaming=false,model='',task='reasoning',tab='chat';
const C=['#6c8cff','#4ade80','#fbbf24','#f87171','#c084fc','#fb923c','#22d3ee','#a78bfa'];
async function init(){
  try{var r=await fetch('/health');var j=await r.json();document.getElementById('apiLabel').textContent='v'+j.version;document.getElementById('apiDot').className='dot ok'}catch(e){document.getElementById('apiDot').className='dot err'}
  await loadModels();await loadSessions();await loadTools();refreshAll();
  setInterval(refreshAll,5000);
}
async function loadModels(){
  try{var r=await fetch('/api/v1/chat/models');var d=await r.json();var s=document.getElementById('modelSel');
  d.available_models.forEach(m=>{var o=document.createElement('option');o.value=m;o.textContent=m;s.appendChild(o)})}catch(e){}
}
async function loadSessions(){
  try{var r=await fetch('/api/v1/chat/sessions');var d=await r.json();
  document.getElementById('sessList').innerHTML=(d.items||[]).map(s=>`<div class="sess${S===s.id?' active':''}" onclick="openSess('${s.id}')">${s.title||'未命名'}</div>`).join('')||'<div class="empty">暂无会话</div>'}catch(e){}
}
async function loadTools(){
  try{var r=await fetch('/api/v1/tools');var d=await r.json();
  document.getElementById('toolPanel').innerHTML=d.tools.map(t=>`<div style="margin-bottom:4px"><b>${t.name}</b><br><span style="color:var(--text-dim)">${t.description}</span>${t.is_dangerous?' 🔴':''}</div>`).join('')}catch(e){}
}
function switchTab(t){
  tab=t;
  document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));
  document.getElementById('tab-'+t).classList.add('active');
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.getElementById('view-'+t).classList.add('active');
  if(t==='trace')loadTraces();
  if(t==='agents')loadAgents();
  if(t==='analytics')loadAnalytics();
}
function setModel(){model=document.getElementById('modelSel').value}
function setTask(){task=document.getElementById('taskSel').value}
async function newChat(){
  try{var r=await fetch('/api/v1/chat/sessions',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({title:'新对话'})});var j=await r.json();S=j.id;document.getElementById('msgs').innerHTML='';loadSessions()}catch(e){}
}
function openSess(id){S=id;loadSessions();switchTab('chat')}
async function send(){
  var inp=document.getElementById('inp');var t=inp.value.trim();if(!t||streaming)return;
  if(t.startsWith('/')){inp.value='';handleCmd(t);return}
  if(!S)await newChat();if(!S)return;
  inp.value='';addMsg('user',t);streaming=true;document.getElementById('sendBtn').disabled=true;
  var div=addMsg('agent',''),full='';
  try{
    var resp=await fetch('/api/v1/chat/sessions/'+S+'/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({content:t,model:model||undefined,task_type:task})});
    var reader=resp.body.getReader(),decoder=new TextDecoder(),buf='';
    while(true){var{value,done}=await reader.read();if(done)break;buf+=decoder.decode(value,{stream:true});
      var lines=buf.split('\n');buf=lines.pop();
      for(var l of lines){if(!l.startsWith('data: '))continue;
        try{var d=JSON.parse(l.slice(6));
          if(d.type==='text'){full+=d.content;div.innerHTML=esc(full)}
          else if(d.type==='tool_calls'||d.type==='tool_call'){(d.calls||[d]).forEach(c=>{var cd=document.createElement('div');cd.className='tool';cd.textContent='🔧 '+(c.function?.name||c.name||'?');div.appendChild(cd)})}
          else if(d.type==='done'){document.getElementById('apiLabel').textContent=(d.usage?.total_tokens||0)+' tok'}
          else if(d.type==='error'){div.innerHTML+='<span style="color:var(--red)">❌ '+esc(d.message)+'</span>'}
        }catch(e){}
      }
    }
  }catch(e){div.innerHTML+='<span style="color:var(--red)">请求失败: '+esc(e.message)+'</span>'}
  streaming=false;document.getElementById('sendBtn').disabled=false;loadSessions();
}
function addMsg(role,content){var m=document.getElementById('msgs');var d=document.createElement('div');d.className='msg '+role;d.innerHTML=esc(content||'');m.appendChild(d);m.scrollTop=m.scrollHeight;return d}
function esc(s){if(!s)return'';return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/```(\w*)\n?([\s\S]*?)```/g,'<pre><code>$2</code></pre>').replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\n/g,'<br>')}
function handleCmd(c){var p=c.split(/\s+/);
  switch(p[0]){case'/model':if(p[1]){document.getElementById('modelSel').value=p[1];setModel()};break;
  case'/models':addMsg('agent','可用模型: '+Array.from(document.getElementById('modelSel').options).map(o=>o.value).join(', '));break;
  case'/task':if(p[1]){document.getElementById('taskSel').value=p[1];setTask()};break;
  case'/clear':document.getElementById('msgs').innerHTML='';break}
}
// Traces
async function loadTraces(){
  try{var r=await fetch('/api/v1/evals/traces');var d=await r.json();var ts=d.traces||[];
  document.getElementById('traceStats').innerHTML='<div class="kpi"><div class="v" style="color:var(--accent)">'+ts.length+'</div><div class="l">Traces</div></div>';
  document.getElementById('traceList').innerHTML=ts.length?ts.map(t=>`<div class="task-card" onclick="loadTrace('${t.trace_id}')"><div class="t">${t.name||t.trace_id}</div><div class="m">${t.span_count||0} spans · ${t.total_latency_ms||0}ms · ${t.total_tokens||0} tok ${t.has_error?'<span class="badge err">错误</span>':''}</div></div>`).join(''):'<div class="empty">暂无 Trace</div>'}catch(e){}
}
async function loadTrace(id){
  try{var r=await fetch('/api/v1/evals/traces/'+id);var t=await r.json();
  document.getElementById('traceList').innerHTML='<button onclick="loadTraces()" style="background:var(--border);color:var(--text);border:none;padding:6px 12px;border-radius:6px;cursor:pointer;font-size:12px;margin-bottom:12px">← 返回列表</button>'+'<div class="kpi-grid"><div class="kpi"><div class="v" style="color:var(--accent)">'+countSpans(t)+'</div><div class="l">Spans</div></div><div class="kpi"><div class="v">'+t.latency_ms+'ms</div><div class="l">延迟</div></div></div>'+renderSpan(t,0)}catch(e){}
}
function countSpans(s){return 1+(s.children||[]).reduce((a,c)=>a+countSpans(c),0)}
function renderSpan(s,d){var tp=s.type==='llm_call'?'llm':s.type==='tool_call'?'tool':s.type==='agent_think'?'think':s.type==='rag_retrieval'?'rag':'';
  return `<div class="span-row"><span style="margin-left:${d*20}px"></span><span class="tp ${tp}">${s.type}</span><span>${s.name||s.model||''}</span><span style="color:var(--text-dim);font-size:10px;margin-left:auto">${s.latency_ms||0}ms</span></div>`+(s.children||[]).map(c=>renderSpan(c,d+1)).join('')}
// Agents
async function loadAgents(){
  try{var r=await fetch('/api/v1/agents/tasks');var d=await r.json();var ps=d.plans||[];
  document.getElementById('agentBoard').innerHTML=ps.length?ps.map(p=>`<div class="task-card"><div class="t">${p.title}</div><div class="m">${p.mode} · ${p.completed||0}/${p.tasks} · <span class="badge ${p.status==='completed'?'ok':p.status==='running'?'warn':'err'}">${p.status}</span></div><div class="prog"><div style="width:${(p.progress||0)*100}%;background:${p.status==='completed'?'var(--green)':'var(--accent)'}"></div></div></div>`).join(''):'<div class="empty">暂无任务</div>';
  try{var r2=await fetch('/api/v1/agents/hitl/pending');var d2=await r2.json();var rs=d2.requests||[];
  document.getElementById('hitlPanel').innerHTML=rs.length?'<h3 style="font-size:13px;margin-bottom:8px">⏸️ HITL 审批 ('+rs.length+')</h3>'+rs.map(r=>`<div class="task-card" style="border-color:var(--yellow)"><div class="t">${r.title}</div><div class="m">${r.description}</div><div style="margin-top:8px;display:flex;gap:6px"><button onclick="hitlAct('${r.id}','approve')" style="background:var(--green);color:#000;border:none;padding:5px 12px;border-radius:5px;cursor:pointer;font-size:11px">批准</button><button onclick="hitlAct('${r.id}','deny')" style="background:var(--red);color:#fff;border:none;padding:5px 12px;border-radius:5px;cursor:pointer;font-size:11px">拒绝</button></div></div>`).join(''):'<div class="empty" style="font-size:11px">无待审批项</div>'}catch(e){}
}catch(e){}
}
async function hitlAct(id,action){await fetch('/api/v1/agents/hitl/'+id+'/action',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:action})});loadAgents()}
// Analytics
async function loadAnalytics(){
  try{var r=await fetch('/api/v1/tools/stats');var d=await r.json();
  document.getElementById('sysStatus').innerHTML='Phase 1-7 ✅<br>8 内置工具<br>'+16+' UI 组件<br>60+ API 端点<br>~140 Python 文件'}</catch(e){}}
  try{var r=await fetch('/api/v1/chat/sessions');var d=await r.json();document.querySelector('#kpiRow .kpi:nth-child(6) .v').textContent=d.total||0}catch(e){}
  try{var r=await fetch('/api/v1/chat/models');var d=await r.json();var ms=d.models||[];var html='';
  var maxT=Math.max(...ms.map((m,i)=>(i+1)*1000));
  ms.forEach((m,i)=>{var v=(i+1)*1000;html+=`<div class="bar-row"><span class="lbl">${m.name}</span><div class="bg"><div class="fg" style="width:${v/maxT*100}%;background:${C[i]}">${v}</div></div></div>`});
  document.getElementById('modelBars').innerHTML=html||'暂无数据'</catch(e){}}
}
async function refreshAll(){if(tab==='trace')loadTraces();if(tab==='agents')loadAgents();if(tab==='analytics')loadAnalytics()}
init();
</script>
</body>
</html>
