<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trace Viewer — AI Agent Platform</title>
<style>
:root { --bg:#0f1117; --surface:#1a1d27; --border:#2a2d3a; --text:#e1e4ea; --text-dim:#8b8fa3; --accent:#6c8cff; --green:#4ade80; --red:#f87171; --yellow:#fbbf24; --purple:#c084fc; }
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: -apple-system, system-ui, sans-serif; background:var(--bg); color:var(--text); height:100vh; display:flex; }
.sidebar { width:280px; background:var(--surface); border-right:1px solid var(--border); display:flex; flex-direction:column; }
.sidebar-header { padding:16px; border-bottom:1px solid var(--border); }
.sidebar-header h2 { font-size:15px; }
.sidebar-header a { color:var(--accent); font-size:12px; text-decoration:none; }
.trace-list { flex:1; overflow-y:auto; padding:8px; }
.trace-item { padding:12px; border-radius:8px; cursor:pointer; margin-bottom:4px; border:1px solid transparent; font-size:12px; }
.trace-item:hover, .trace-item.active { border-color:var(--accent); background:rgba(108,140,255,0.05); }
.trace-item .name { font-weight:600; font-size:13px; }
.trace-item .meta { color:var(--text-dim); font-size:11px; margin-top:4px; }
.main { flex:1; display:flex; flex-direction:column; min-width:0; }
.header { padding:12px 20px; border-bottom:1px solid var(--border); display:flex; align-items:center; gap:12px; }
.header h2 { font-size:16px; }
.viewer { flex:1; overflow-y:auto; padding:20px; }
.span-row { display:flex; align-items:flex-start; padding:5px 0; font-size:13px; }
.span-row .indent { width:24px; flex-shrink:0; text-align:center; color:var(--border); }
.span-row .bar { width:3px; flex-shrink:0; background:var(--border); margin-right:12px; border-radius:2px; align-self:stretch; }
.span-row .bar.llm { background:var(--accent); }
.span-row .bar.tool { background:var(--yellow); }
.span-row .bar.think { background:var(--purple); }
.span-row .bar.rag { background:var(--green); }
.span-row .bar.error { background:var(--red); }
.span-row .content { flex:1; }
.span-row .type { display:inline-block; padding:1px 6px; border-radius:3px; font-size:10px; font-weight:600; margin-right:8px; }
.type.llm { background:rgba(108,140,255,0.15); color:var(--accent); }
.type.tool { background:rgba(251,191,36,0.15); color:var(--yellow); }
.type.think { background:rgba(192,132,252,0.15); color:var(--purple); }
.type.rag { background:rgba(74,222,128,0.15); color:var(--green); }
.type.error { background:rgba(248,113,113,0.15); color:var(--red); }
.span-row .detail { color:var(--text-dim); font-size:11px; margin-top:2px; }
.span-row .latency { font-size:11px; color:var(--text-dim); white-space:nowrap; }
.span-row .tokens { font-size:10px; color:var(--text-dim); margin-left:8px; }
.stat-card { display:inline-block; background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:12px 16px; margin:4px; min-width:100px; text-align:center; }
.stat-card .value { font-size:24px; font-weight:700; }
.stat-card .label { font-size:11px; color:var(--text-dim); }
.stat-card .value.green { color:var(--green); }
.stat-card .value.blue { color:var(--accent); }
.empty { text-align:center; padding:60px; color:var(--text-dim); }
.empty .icon { font-size:48px; margin-bottom:12px; }
button { background:var(--accent); color:#fff; border:none; padding:8px 16px; border-radius:6px; cursor:pointer; font-size:12px; }
button:hover { opacity:0.9; }
.loading { text-align:center; padding:40px; color:var(--text-dim); }
@keyframes pulse { 0%,100% { opacity:1 } 50% { opacity:0.4 } }
.pulse { animation: pulse 1.5s infinite; }
</style>
</head>
<body>

<div class="sidebar">
  <div class="sidebar-header">
    <h2>🔍 Trace Viewer</h2>
    <a href="/">← 返回对话</a>
  </div>
  <div style="padding:8px">
    <button onclick="refreshTraces()" style="width:100%">刷新列表</button>
  </div>
  <div class="trace-list" id="traceList">
    <div class="loading pulse">加载中...</div>
  </div>
</div>

<div class="main">
  <div class="header">
    <h2 id="traceTitle">选择一个 Trace</h2>
    <span style="flex:1"></span>
    <span style="font-size:12px;color:var(--text-dim)" id="traceMeta"></span>
  </div>
  <div class="viewer" id="viewer">
    <div class="empty">
      <div class="icon">🔎</div>
      <div>从左侧选择一个 Trace 查看完整调用链</div>
      <div style="font-size:12px;color:var(--text-dim);margin-top:8px">支持: LLM调用 · 工具调用 · 推理链 · RAG检索</div>
    </div>
  </div>
</div>

<script>
const API = '/api/v1';
let activeTrace = null;

async function refreshTraces() {
  try {
    const r = await fetch(`${API}/evals/traces?limit=50`);
    const data = await r.json();
    renderTraceList(data.traces || []);
  } catch(e) {
    document.getElementById('traceList').innerHTML = '<div class="loading">无数据</div>';
  }
}

function renderTraceList(traces) {
  if (!traces.length) {
    document.getElementById('traceList').innerHTML = '<div class="empty" style="padding:20px"><div>暂无 Trace 数据</div><div style="font-size:11px;color:var(--text-dim)">发送一条消息后将自动记录</div></div>';
    return;
  }
  const html = traces.map(t => `
    <div class="trace-item${activeTrace === t.trace_id ? ' active' : ''}" onclick="selectTrace('${t.trace_id}')">
      <div class="name">${t.name}</div>
      <div class="meta">
        <span style="color:${t.has_error ? 'var(--red)' : 'var(--green)'}">${t.has_error ? '⚠' : '✓'}</span>
        ${t.span_count} spans · ${t.total_latency_ms}ms · ${t.total_tokens} tokens<br>
        ${new Date(t.start_time*1000).toLocaleTimeString()}
      </div>
    </div>
  `).join('');
  document.getElementById('traceList').innerHTML = html;
}

async function selectTrace(id) {
  activeTrace = id;
  try {
    const r = await fetch(`${API}/evals/traces/${id}`);
    const trace = await r.json();
    document.getElementById('traceTitle').textContent = trace.name;
    document.getElementById('traceMeta').textContent = `${trace.type} · ${countSpans(trace)} spans · ${trace.latency_ms}ms`;
    renderTrace(trace);
    refreshTraces();
  } catch(e) {
    document.getElementById('viewer').innerHTML = '<div class="empty">加载失败</div>';
  }
}

function countSpans(span) {
  return 1 + (span.children||[]).reduce((s,c) => s + countSpans(c), 0);
}

function renderTrace(root, depth=0) {
  if (depth === 0) {
    document.getElementById('viewer').innerHTML = '';
    const stats = calcStats(root);
    document.getElementById('viewer').innerHTML = `
      <div style="margin-bottom:20px;display:flex;gap:8px;flex-wrap:wrap">
        <div class="stat-card"><div class="value blue">${stats.totalSpans}</div><div class="label">总 Span 数</div></div>
        <div class="stat-card"><div class="value">${root.latency_ms}ms</div><div class="label">总延迟</div></div>
        <div class="stat-card"><div class="value green">${stats.tokensIn + stats.tokensOut}</div><div class="label">总 Token</div></div>
        <div class="stat-card"><div class="value">${stats.llmCalls}</div><div class="label">LLM 调用</div></div>
        <div class="stat-card"><div class="value">${stats.toolCalls}</div><div class="label">工具调用</div></div>
        ${stats.errors > 0 ? `<div class="stat-card"><div class="value" style="color:var(--red)">${stats.errors}</div><div class="label">错误</div></div>` : ''}
      </div>
      <div style="border-top:1px solid var(--border);padding-top:12px">`;
    renderSpan(root, 0);
    document.getElementById('viewer').innerHTML += '</div>';
  }
}

function calcStats(span) {
  let stats = { totalSpans: 1, llmCalls: 0, toolCalls: 0, thinkCalls: 0, ragCalls: 0, errors: 0, tokensIn: span.tokens_in||0, tokensOut: span.tokens_out||0 };
  if (span.type === 'llm_call') stats.llmCalls++;
  else if (span.type === 'tool_call') stats.toolCalls++;
  else if (span.type === 'agent_think') stats.thinkCalls++;
  else if (span.type === 'rag_retrieval') stats.ragCalls++;
  if (span.error) stats.errors++;
  for (const c of (span.children||[])) {
    const cs = calcStats(c);
    Object.keys(stats).forEach(k => stats[k] += cs[k]);
  }
  return stats;
}

function renderSpan(span, depth) {
  const typeClass = span.type === 'llm_call' ? 'llm' : span.type === 'tool_call' ? 'tool' : span.type === 'agent_think' ? 'think' : span.type === 'rag_retrieval' ? 'rag' : span.error ? 'error' : '';
  const barClass = span.type === 'llm_call' ? 'llm' : span.type === 'tool_call' ? 'tool' : span.type === 'agent_think' ? 'think' : span.type === 'rag_retrieval' ? 'rag' : span.error ? 'error' : '';
  const typeLabel = {llm_call:'LLM',tool_call:'工具',agent_think:'推理',rag_retrieval:'RAG',workflow:'流程'}[span.type] || span.type;
  const typeIcons = {llm_call:'🧠',tool_call:'🔧',agent_think:'💭',rag_retrieval:'📚',workflow:'🔄'};

  const detail = span.model ? `模型: ${span.model}` : span.name;
  const latency = span.latency_ms ? `${span.latency_ms}ms` : '';
  const tokens = (span.tokens_in || span.tokens_out) ? `${span.tokens_in}↑ ${span.tokens_out}↓` : '';

  const div = document.createElement('div');
  div.innerHTML = `
    <div class="span-row">
      <div class="indent">${'│'.repeat(Math.max(0,depth))}</div>
      <div class="bar ${barClass}"></div>
      <div class="content">
        <span class="type ${typeClass}">${typeIcons[span.type]||''} ${typeLabel}</span>
        <span>${detail}</span>
        ${span.error ? `<span style="color:var(--red);font-size:11px"> ⚠ ${span.error}</span>` : ''}
        <div class="detail">${span.metadata?.goal || span.metadata?.query || ''}</div>
      </div>
      <div class="latency">${latency}</div>
      <div class="tokens">${tokens}</div>
    </div>`;
  document.getElementById('viewer').appendChild(div);

  (span.children||[]).forEach(c => renderSpan(c, depth+1));
}

refreshTraces();
</script>
</body>
</html>
