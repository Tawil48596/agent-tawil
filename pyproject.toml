[project]
name = "ai-agent-platform"
version = "0.1.0"
description = "通用 AI Agent 平台 — 多智能体协作、MCP 网关、RAG 检索增强、工具市场"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "Tawil48596"}
]
keywords = ["ai", "agent", "llm", "rag", "mcp", "multi-agent"]

dependencies = [
    # Web Framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sse-starlette>=2.0.0",

    # LLM
    "litellm>=1.50.0",
    "openai>=1.50.0",
    "anthropic>=0.40.0",
    "tiktoken>=0.7.0",

    # Database
    "sqlalchemy[asyncio]>=2.0.30",
    "aiosqlite>=0.20.0",

    # Vector Store
    "chromadb>=0.5.0",

    # Cache & Queue
    "redis[hiredis]>=5.0.0",

    # RAG
    "rank-bm25>=0.2.2",

    # MCP
    "mcp>=1.0.0",

    # Document Processing
    "pypdf>=4.0.0",
    "markdown-it-py>=3.0.0",
    "beautifulsoup4>=4.12.0",

    # GitHub
    "PyGithub>=2.3.0",
    "GitPython>=3.1.40",

    # Browser Automation
    "playwright>=1.45.0",

    # Observability
    "opentelemetry-api>=1.25.0",
    "opentelemetry-sdk>=1.25.0",
    "opentelemetry-instrumentation-fastapi>=0.46b0",
    "structlog>=24.0.0",

    # Auth
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",

    # Config
    "pyyaml>=6.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.3.0",

    # Utils
    "httpx>=0.27.0",
    "tenacity>=8.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "pre-commit>=3.8.0",
    "locust>=2.30.0",
]

postgres = [
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.9",
]

milvus = [
    "pymilvus>=2.4.0",
]

docker-sandbox = [
    "docker>=7.1.0",
]

all = [
    "ai-agent-platform[dev,postgres,milvus,docker-sandbox]",
]

[project.scripts]
ai-agent = "app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --cov=core --cov=plugins --cov=services --cov=shared --cov-report=term-missing"

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
